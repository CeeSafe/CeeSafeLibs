[package]
name = "tls"
version = "0.1.0"
kind = "library"
c = ["c/tls_shim.c"]
tests = ["tests"]
links = ["ssl", "crypto"]

# Homebrew's OpenSSL 3 (Apple Silicon). On Linux the distribution's libssl-dev is on the default paths.
[target.macos]
lib-dirs = ["/opt/homebrew/opt/openssl@3/lib"]
include-dirs = ["/opt/homebrew/opt/openssl@3/include"]

# On Linux the shim's own header must be found too: ceesafec compiles c/tls_shim.c from a copy without its directory.
[target.linux]
include-dirs = ["c"]

[dependencies]
