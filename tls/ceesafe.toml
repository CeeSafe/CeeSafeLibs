[package]
name = "tls"
version = "0.1.0"
kind = "library"
tests = ["tests"]
links = ["ssl", "crypto"]

# Homebrew's OpenSSL 3 (Apple Silicon). On Linux the distribution's libssl is on the default paths. No header is
# needed: src/ffi.cee declares what it calls.
[target.macos]
lib-dirs = ["/opt/homebrew/opt/openssl@3/lib"]

[dependencies]
